Port 3128
Listen 0.0.0.0

# The build network is `internal` and carries nothing but build sandboxes and
# this proxy, so membership of that network is the authorisation.
Allow 0.0.0.0/0

# CONNECT is only ever needed for TLS to a repository.
ConnectPort 443

# An allowlist, not a blocklist: see the file for why.
Filter "/etc/tinyproxy/allowlist"
FilterDefaultDeny Yes
FilterExtended On

# Nothing about the audit a build belongs to is disclosed upstream.
DisableViaHeader Yes
XTinyproxy No

Timeout 600
MaxClients 64
StartServers 2

LogLevel Info
PidFile "/tmp/tinyproxy.pid"
