services:
  cairn-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${CAIRN_POSTGRES_USER:-cairn}
      POSTGRES_PASSWORD: ${CAIRN_POSTGRES_PASSWORD:-cairn}
      POSTGRES_DB: ${CAIRN_POSTGRES_DB:-cairn}
    volumes:
      - cairn-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - cairn-control

  cairn-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: cairn-audit-api:local
    environment:
      CAIRN_DATABASE_URL: postgresql+psycopg://${CAIRN_POSTGRES_USER:-cairn}:${CAIRN_POSTGRES_PASSWORD:-cairn}@cairn-postgres:5432/${CAIRN_POSTGRES_DB:-cairn}
      CAIRN_SQL_ECHO: ${CAIRN_SQL_ECHO:-false}
      CAIRN_ARTIFACT_ROOT: /var/lib/cairn/artifacts
      CAIRN_INGESTION_WORK_ROOT: /var/lib/cairn/ingestion
      CAIRN_GIT_ALLOWED_HOSTS: ${CAIRN_GIT_ALLOWED_HOSTS:-}
      CAIRN_SECRET_KEY_FILE: ${CAIRN_SECRET_KEY_FILE:-/run/secrets/cairn_master_key}
      CAIRN_LLM_PROVIDER_CONFIG_FILE: /var/lib/cairn/llm/provider.json
      CAIRN_LLM_PROVIDER_TIMEOUT_SECONDS: ${CAIRN_LLM_PROVIDER_TIMEOUT_SECONDS:-30}
      # This Compose profile publishes plain HTTP on localhost. HTTPS
      # deployments must leave the secure default enabled.
      CAIRN_SESSION_COOKIE_SECURE: "false"
    depends_on:
      cairn-postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - cairn-artifact-data:/var/lib/cairn/artifacts
      - cairn-ingestion-data:/var/lib/cairn/ingestion
      - type: bind
        source: ${CAIRN_LLM_CONFIG_HOST_DIR:-/var/lib/cairn/llm}
        target: /var/lib/cairn/llm
      - type: bind
        source: ${CAIRN_SECRET_KEY_HOST_FILE:-/var/lib/cairn/secrets/master-key}
        target: /run/secrets/cairn_master_key
        read_only: true
    command:
      - /bin/sh
      - -ec
      - |
        uv run alembic -c alembic.ini upgrade head
        exec uv run cairn serve --host 0.0.0.0 --no-access-log
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=5)
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - cairn-control

  cairn-orchestrator:
    build:
      context: .
      dockerfile: Dockerfile
    image: cairn-audit-api:local
    environment:
      CAIRN_DATABASE_URL: postgresql+psycopg://${CAIRN_POSTGRES_USER:-cairn}:${CAIRN_POSTGRES_PASSWORD:-cairn}@cairn-postgres:5432/${CAIRN_POSTGRES_DB:-cairn}
      CAIRN_SQL_ECHO: ${CAIRN_SQL_ECHO:-false}
      CAIRN_ARTIFACT_ROOT: /var/lib/cairn/artifacts
      CAIRN_INGESTION_WORK_ROOT: /var/lib/cairn/ingestion
      CAIRN_GIT_ALLOWED_HOSTS: ${CAIRN_GIT_ALLOWED_HOSTS:-}
      CAIRN_SECRET_KEY_FILE: ${CAIRN_SECRET_KEY_FILE:-/run/secrets/cairn_master_key}
      CAIRN_SANDBOX_API_URL: http://cairn-sandbox-manager:8001
      CAIRN_SANDBOX_AUTH_TOKEN_FILE: /run/secrets/cairn_sandbox_token
      # The Orchestrator mints model grants, so it holds the grant signing key.
      # It deliberately holds no provider decryption key or plaintext API key.
      # It reads only public metadata to bind the selected model into grants.
      CAIRN_LLM_GATEWAY_URL: http://cairn-llm-gateway:8002
      CAIRN_LLM_GRANT_KEY_FILE: /run/secrets/cairn_llm_grant_key
      CAIRN_LLM_PROVIDER_CONFIG_FILE: /var/lib/cairn/llm/provider.json
    depends_on:
      cairn-server:
        condition: service_healthy
      cairn-sandbox-manager:
        condition: service_healthy
    volumes:
      - cairn-artifact-data:/var/lib/cairn/artifacts
      - cairn-ingestion-data:/var/lib/cairn/ingestion
      - type: bind
        source: ${CAIRN_LLM_CONFIG_HOST_DIR:-/var/lib/cairn/llm}
        target: /var/lib/cairn/llm
        read_only: true
      - type: bind
        source: ${CAIRN_SANDBOX_AUTH_TOKEN_HOST_FILE:-/var/lib/cairn/secrets/sandbox-token}
        target: /run/secrets/cairn_sandbox_token
        read_only: true
      - type: bind
        source: ${CAIRN_LLM_GRANT_KEY_HOST_FILE:-/var/lib/cairn/secrets/llm-grant-key}
        target: /run/secrets/cairn_llm_grant_key
        read_only: true
    command:
      - uv
      - run
      - cairn
      - orchestrate
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - cairn-control
      - cairn-sandbox-api

  cairn-sandbox-manager:
    build:
      context: .
      dockerfile: Dockerfile.sandbox-manager
    image: cairn-sandbox-manager:local
    environment:
      CAIRN_SANDBOX_DOCKER_HOST: unix:///run/cairn-rootless-docker.sock
      CAIRN_SANDBOX_REQUIRE_ROOTLESS: "true"
      CAIRN_SANDBOX_AUTH_TOKEN_FILE: /run/secrets/cairn_sandbox_token
      CAIRN_SANDBOX_ARTIFACT_ROOT: /var/lib/cairn/artifacts
      CAIRN_SANDBOX_STATE_ROOT: /var/lib/cairn/sandbox-state
      # Docker resolves bind sources in the daemon's host namespace, not in
      # this Manager container. Mount the workspace at the same absolute path
      # on both sides so a rootless daemon can see every path it is given.
      CAIRN_SANDBOX_WORK_ROOT: ${CAIRN_SANDBOX_HOST_WORK_ROOT:-/var/lib/cairn/sandbox-work}
      CAIRN_SANDBOX_ANALYSIS_IMAGE: ${CAIRN_SANDBOX_ANALYSIS_IMAGE:-cairn-sandbox-analysis:local}
      CAIRN_SANDBOX_BUILD_IMAGE: ${CAIRN_SANDBOX_BUILD_IMAGE:-cairn-sandbox-build:local}
      CAIRN_SANDBOX_VALIDATION_IMAGE: ${CAIRN_SANDBOX_VALIDATION_IMAGE:-cairn-sandbox-validation:local}
      CAIRN_SANDBOX_HELPER_IMAGE: ${CAIRN_SANDBOX_HELPER_IMAGE:-cairn-sandbox-helper:local}
      CAIRN_SANDBOX_SEMANTIC_IMAGE: ${CAIRN_SANDBOX_SEMANTIC_IMAGE:-cairn-sandbox-semantic:local}
      CAIRN_SANDBOX_BUILD_NETWORK: ${CAIRN_SANDBOX_BUILD_NETWORK:-}
      # The Manager drives its OWN rootless daemon, so the Compose network
      # `cairn-analysis-net` below is not visible to it. The operator must
      # create an equivalent restricted network on that daemon which routes to
      # cairn-llm-gateway:8002, exactly as for the build dependency proxy.
      # Left unset, the semantic template has no route to the Gateway and its
      # tasks fail with a coverage warning rather than silently reviewing
      # nothing.
      CAIRN_SANDBOX_SEMANTIC_NETWORK: ${CAIRN_SANDBOX_SEMANTIC_NETWORK:-}
    volumes:
      - cairn-artifact-data:/var/lib/cairn/artifacts
      - cairn-sandbox-state:/var/lib/cairn/sandbox-state
      - type: bind
        source: ${CAIRN_ROOTLESS_DOCKER_SOCKET:-/run/user/999/docker.sock}
        target: /run/cairn-rootless-docker.sock
      - type: bind
        source: ${CAIRN_SANDBOX_HOST_WORK_ROOT:-/var/lib/cairn/sandbox-work}
        target: ${CAIRN_SANDBOX_HOST_WORK_ROOT:-/var/lib/cairn/sandbox-work}
      - type: bind
        source: ${CAIRN_SANDBOX_AUTH_TOKEN_HOST_FILE:-/var/lib/cairn/secrets/sandbox-token}
        target: /run/secrets/cairn_sandbox_token
        read_only: true
    command:
      - uv
      - run
      - cairn
      - sandbox-serve
      - --host
      - 0.0.0.0
      - --port
      - "8001"
      - --no-access-log
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health/ready', timeout=5)
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - cairn-sandbox-api

  cairn-llm-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    image: cairn-audit-api:local
    environment:
      # The only inference component that can decrypt the long-term model API
      # key. Workers reach it with short-lived grants signed by the grant key,
      # which the Orchestrator also holds. The Admin API can decrypt the same
      # encrypted configuration only for updates and model enumeration.
      CAIRN_LLM_GRANT_KEY_FILE: /run/secrets/cairn_llm_grant_key
      CAIRN_LLM_PROVIDER_CONFIG_FILE: /var/lib/cairn/llm/provider.json
      CAIRN_LLM_CONFIG_KEY_FILE: /run/secrets/cairn_master_key
      CAIRN_LLM_MAX_REQUEST_BYTES: ${CAIRN_LLM_MAX_REQUEST_BYTES:-4194304}
      CAIRN_LLM_MAX_OUTPUT_TOKENS: ${CAIRN_LLM_MAX_OUTPUT_TOKENS:-32000}
      CAIRN_LLM_REQUEST_TIMEOUT_SECONDS: ${CAIRN_LLM_REQUEST_TIMEOUT_SECONDS:-600}
      CAIRN_LLM_CIRCUIT_FAILURE_THRESHOLD: ${CAIRN_LLM_CIRCUIT_FAILURE_THRESHOLD:-5}
      CAIRN_LLM_CIRCUIT_RESET_SECONDS: ${CAIRN_LLM_CIRCUIT_RESET_SECONDS:-60}
      CAIRN_LLM_REFUSAL_FALLBACK: ${CAIRN_LLM_REFUSAL_FALLBACK:-true}
    volumes:
      - type: bind
        source: ${CAIRN_LLM_GRANT_KEY_HOST_FILE:-/var/lib/cairn/secrets/llm-grant-key}
        target: /run/secrets/cairn_llm_grant_key
        read_only: true
      - type: bind
        source: ${CAIRN_SECRET_KEY_HOST_FILE:-/var/lib/cairn/secrets/master-key}
        target: /run/secrets/cairn_master_key
        read_only: true
      - type: bind
        source: ${CAIRN_LLM_CONFIG_HOST_DIR:-/var/lib/cairn/llm}
        target: /var/lib/cairn/llm
        read_only: true
    command:
      - uv
      - run
      - cairn
      - gateway-serve
      - --host
      - 0.0.0.0
      - --port
      - "8002"
      - --no-access-log
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health/ready', timeout=5)
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      # cairn-analysis-net is internal: it is how the semantic sandbox reaches
      # the Gateway without gaining a route to the open internet (§9.4).
      # cairn-llm-egress is the Gateway's own — and only — route out.
      # Deliberately absent: cairn-control (no PostgreSQL reachability from the
      # key holder) and cairn-sandbox-api (no Artifact Store, no Docker daemon).
      - cairn-analysis-net
      - cairn-llm-egress

volumes:
  cairn-artifact-data:
  cairn-ingestion-data:
  cairn-postgres-data:
  cairn-sandbox-state:

networks:
  cairn-control:
  cairn-sandbox-api:
    internal: true
  # The read-only AI analysis network (design spec §9.4). Being internal is
  # what denies the semantic reviewer the open internet: the Gateway is the
  # only reachable egress, and it enforces grant, model and budget policy.
  cairn-analysis-net:
    internal: true
  # The Gateway's dedicated route to the upstream model API. No other service
  # attaches to it.
  cairn-llm-egress:
