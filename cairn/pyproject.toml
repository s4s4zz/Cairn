[project]
name = "cairn"
version = "0.2.1"
description = "Single-tenant Java source code audit platform"
authors = [
    { name = "leixiao", email = "1729888211@qq.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.16,<2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "click>=8.1",
    "cryptography>=45,<47",
    "docker>=7.1.0",
    "pydantic-settings>=2.10,<3",
    "psycopg[binary]>=3.2,<4",
    # Spring application configs are YAML, and the build-plan detector reads
    # them with `safe_load` under size bounds. Declared explicitly rather than
    # relied on transitively through uvicorn[standard].
    "pyyaml>=6,<7",
    "requests>=2.32.3",
    "sqlalchemy>=2.0.40,<3",
]

[project.optional-dependencies]
# Installed only into the semantic sandbox image. The control-plane image
# (Dockerfile / Dockerfile.sandbox-manager) syncs without extras, so it gains
# no new runtime dependency, and `anthropic` is never a hard import of any
# module the test suite collects.
semantic = [
    "anthropic>=0.120,<1",
]

[project.scripts]
cairn = "cairn.cli:main"

[build-system]
requires = ["uv_build>=0.8.9,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.3",
    "pyyaml>=6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "docker: requires an explicitly configured disposable Docker daemon",
    "docker_local: runs against the developer's ordinary Docker daemon; NOT the rootless configuration production requires",
    "postgres: requires TEST_DATABASE_URL pointing to PostgreSQL",
]

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple"
default = true
